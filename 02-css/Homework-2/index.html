<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google 1998 - Clone</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="logo-area">
      <img
        src="https://web.archive.org/web/19981202230410im_/http://www.google.com/google.jpg"
        alt="Google! Beta"
        class="logo"
      />
    </header>

    <section class="search-box">
      <p class="subtitle">Search the web using Google!</p>

      <form class="search-form" action="#" method="get">
        <input
          type="text"
          class="search-input"
          name="q"
          aria-label="Search"
        />

        <div class="button-row">
          <button type="button" class="btn">Google Search</button>
          <button type="button" class="btn">I'm feeling lucky</button>
        </div>
      </form>
    </section>

    <section class="bottom-bars">
      <div class="bar bar-left">
        <p class="bar-title">Special Searches</p>
        <a href="https://web.archive.org/web/19981202230410/http://www.google.com/stanford" target="_blank" rel="noopener">Stanford Search</a>
        <a href="https://web.archive.org/web/19981202230410/http://www.google.com/linux" target="_blank" rel="noopener">Linux Search</a>
      </div>

      <div class="bar bar-mid">
        <a href="#" class="bar-link">Help!</a>
        <a href="#" class="bar-link">About Google!</a>
        <a href="#" class="bar-link">Company Info</a>
        <a href="#" class="bar-link">Google! Logos</a>
      </div>

      <div class="bar bar-right">
        <p class="bar-title">Get Google!</p>
        <p class="bar-subtitle">updates monthly:</p>

        <form class="subscribe-form" action="#" method="post">
          <input
            type="email"
            class="email-input"
            placeholder="your e-mail"
            aria-label="Email"
          />
          <button type="button" class="btn btn-small">Subscribe</button>
          <a href="#" class="bar-link archive-link">Archive</a>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>Copyright ©1998 Google Inc.</p>
    </footer>
  </main>
</body>
</html>
