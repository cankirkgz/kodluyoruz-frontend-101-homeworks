<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="topbar">
    <nav class="topbar-left">
      <a href="#" class="top-link">About</a>
      <a href="#" class="top-link">Store</a>
    </nav>

    <nav class="topbar-right">
      <a href="#" class="top-link">Gmail</a>
      <a href="#" class="top-link">Images</a>

      <button class="icon-btn" aria-label="Google apps">
        <img src="assets/appsbutton.svg" alt="Apps" class="apps-icon" />
      </button>

      <img class="avatar" src="assets/profilepic.jpg" alt="Profil" />

      <a href="#" class="signin-btn">Sign in</a>
    </nav>
  </header>

  <main class="hero">
    <img class="google-logo" src="assets/logo.png" alt="Google" />

    <section class="search-area">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path d="M10 4a6 6 0 104.47 10.03l4.75 4.75 1.41-1.41-4.75-4.75A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"></path>
          </svg>
        </span>

        <input class="search-input" type="text" aria-label="Google Search" />

        <button class="mic-btn" aria-label="Voice search">
          <img src="assets/voicelogo.png" alt="Voice" class="mic-icon" />
        </button>
      </div>

      <div class="buttons">
        <button class="g-btn" type="button">Google Search</button>
        <button class="g-btn" type="button">I'm Feeling Lucky</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <ul class="footer-left">
      <li><a href="#">Advertising</a></li>
      <li><a href="#">Business</a></li>
      <li><a href="#">How Search works</a></li>
    </ul>

    <ul class="footer-right">
      <li><a href="#">Privacy</a></li>
      <li><a href="#">Terms</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </footer>

</body>
</html>
